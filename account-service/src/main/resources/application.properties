spring.application.name=account-service
server.port=8081

# Database: file-based H2 so data survives restarts during demos
spring.datasource.url=jdbc:h2:file:./data/accountdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (values come from environment variables; defaults are for local dev only)
app.jwt.secret=${JWT_SECRET:change-me-this-default-is-only-for-local-development-1234}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

# Seeded admin (env vars; defaults for local dev only)
app.admin.email=${ADMIN_EMAIL:admin@ridelink.local}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}